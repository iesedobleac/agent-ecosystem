version: 2

project_name: iesedoble-ai

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/iesedoble-ai
    binary: iesedoble-ai
    env:
      - CGO_ENABLED=0
    # Windows installs with `go install` until the binaries can be signed.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: iesedoble-ai
    binaries:
      - iesedoble-ai
    homepage: "https://github.com/iesedobleac/iesedoble-ai"
    description: "Agents, skills, rules and MCP servers for OpenCode and Claude Code"
    repository:
      owner: iesedobleac
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binary is not notarized: clear the quarantine flag so macOS runs it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iesedoble-ai"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
